name = "softmax"
toolchain = "triton"
kernel_regex = "softmax_kernel"

[requires]
min_cc = 8.0

[tolerance]
atol = 1e-3
rtol = 1e-3

[[cases]]
name = "4096x4096-f32"
rows = 4096
cols = 4096
dtype = "float32"

[[cases]]
name = "8192x8192-f16"
rows = 8192
cols = 8192
dtype = "float16"

[[cases]]
name = "65536x1024-f16"
rows = 65536
cols = 1024
dtype = "float16"
