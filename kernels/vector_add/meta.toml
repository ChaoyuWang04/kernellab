name = "vector_add"
toolchain = "triton"
kernel_regex = "add_kernel"   # ncu -k 过滤;Triton 生成的 kernel 名就是函数名

[requires]
min_cc = 8.0
features = []

[tolerance]
atol = 1e-6
rtol = 1e-6

[[cases]]
name = "1M"
n = 1048576
dtype = "float32"

[[cases]]
name = "64M"
n = 67108864
dtype = "float32"

[[cases]]
name = "256M-f16"
n = 268435456
dtype = "float16"
