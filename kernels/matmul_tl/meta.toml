name = "matmul_tl"
toolchain = "tilelang"
kernel_regex = "gemm_kernel"   # TileLang 0.1.14 生成的名字(ncu 实测)

# 与 kernels/matmul(Triton 版)同一数学、同一 case,用来做跨 DSL 对照。
# TileLang 的 T.gemm 会按架构自己选 mma.sync / wgmma / tcgen05,所以不声明特性,两张卡都能跑。
[requires]
min_cc = 8.0
features = []

[tolerance]
atol = 1e-1
rtol = 1e-2

[[cases]]
name = "4096-f16"
m = 4096
n = 4096
k = 4096
dtype = "float16"

[[cases]]
name = "8192-f16"
m = 8192
n = 8192
k = 8192
dtype = "float16"

[sweep]
BLOCK_M = [64, 128]
BLOCK_N = [64, 128, 256]
BLOCK_K = [32, 64]
NUM_STAGES = [2, 3]
