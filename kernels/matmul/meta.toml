name = "matmul"
toolchain = "triton"
kernel_regex = "matmul_kernel"

# 用来验证后端插拔:声明需要 wgmma(Hopper 的异步 warpgroup MMA)。
# 5090(sm_120)没有 wgmma,harness 会拒绝并提示换 target;H100 上 Triton 把 tl.dot 直接降到 wgmma。
# 想在 5090 上用 mma.sync 跑同一份代码做对照:加 --ignore-requires。
[requires]
min_cc = 9.0
features = ["wgmma"]

[tolerance]
atol = 1e-1
rtol = 1e-2

[[cases]]
name = "4096-f16"
m = 4096
n = 4096
k = 4096
dtype = "float16"

[[cases]]
name = "8192-f16"
m = 8192
n = 8192
k = 8192
dtype = "float16"

# klab sweep 的候选;5090 共享内存约 99 KB,BLOCK_N=256 且 4 级流水的组合会超限,扫参会把它记成失败
[sweep]
BLOCK_M = [64, 128]
BLOCK_N = [64, 128, 256]
BLOCK_K = [32, 64]
NUM_STAGES = [3, 4]
NUM_WARPS = [4, 8]
