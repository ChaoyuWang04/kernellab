[project]
name = "klab"
version = "0.1.0"
description = "Mac 上写算子,远端 GPU 上编译、跑、测速、NCU;后端可插拔"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "modal>=1.5.5",
]

[project.scripts]
klab = "klab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
