# 执行后端登记表。klab 的每条命令都用 --target <名字> 显式选一个。
# kind = ssh   : 任何能 ssh 上去的机器(home lab、vast、runpod、autodl……)
# kind = local : 在当前机器上直接跑(用于在盒子上调试 harness 本身)
#
# 选后端的规则(agent 照此办,用户点名优先):默认 5090home;算子 requires.features 里有 5090 没有的特性
# (wgmma / tma / cluster / tcgen05 / tmem),或用户点名要 H100 / B200 时,才去 Modal。

[defaults]
target = "5090home"
# kind = modal : Modal 云 GPU,gpu 字段选卡型(H100 / H200 / B200 / A100-80GB / L40S),凭据读 ~/.modal.toml

[targets.5090home]
kind = "ssh"
host = "5090home"            # ~/.ssh/config 里的 Host 别名
root = "~/klab"              # 远端根目录:repo/ envs/ runs/
python = "3.12"              # 远端 venv 用的解释器版本
cuda_bin = "/usr/local/cuda/bin"
# 公开规格峰值,只用来算 roofline 百分比;`klab probe` 会实测拷贝带宽与 matmul 吞吐
peak_gbps = 1792             # 512-bit GDDR7 @ 28 Gbps
peak_tflops_fp16 = 230       # klab probe 2026-09-18 实测 8192³ fp16 matmul 229.8 TFLOPS,取整作为可达峰值
peak_tflops_fp32 = 104.8

[targets.local]
kind = "local"
root = "~/klab"
python = "3.12"
cuda_bin = "/usr/local/cuda/bin"

[targets.modal-h100]
kind = "modal"
gpu = "H100"
root = "/root/klab"
api_proxy = "http://127.0.0.1:3213"   # 直连 api.modal.com 不通时才用
ncu_clock_control = "none"           # 容器里锁不了时钟;数字会比锁频时抖
peak_gbps = 3350             # H100 SXM HBM3 公开规格
peak_tflops_fp16 = 770       # klab probe 2026-09-18 实测 8192³ fp16 matmul 770 TFLOPS(公开规格 989 dense)
peak_tflops_fp32 = 67

# 真·安培(数据中心)。练「安培特性」这条线的正主:5090 虽然也走 mma.sync + cp.async,
# 但它是 sm_120,L2 96 MB、SM 170 个、消费卡会降频,共享内存上限也不同,结论不通用。
[targets.modal-a100]
kind = "modal"
gpu = "A100-80GB"
root = "/root/klab"
api_proxy = "http://127.0.0.1:3213"
ncu_clock_control = "none"           # 容器里锁不了时钟
peak_gbps = 2039             # A100 80GB SXM HBM2e 公开规格(klab probe 实测拷贝 1732.6)
peak_tflops_fp16 = 258       # 2026-09-19 实测可达上限:autotune 后的 triton matmul 4096³ 到 257.9
                             # (klab probe 只测到 241,它用的是固定配置;公开规格 312 dense)
peak_tflops_fp32 = 19.5

# 数据中心 Blackwell。sm_100:第五代 tensor core(tcgen05)+ tmem,累加器搬出寄存器。
# 这是 ARCH_FEATURES 里唯一一行此前没有真卡验证过的。
[targets.modal-b200]
kind = "modal"
gpu = "B200"
root = "/root/klab"
api_proxy = "http://127.0.0.1:3213"
ncu_clock_control = "none"
peak_gbps = 8000             # B200 HBM3e 公开规格(klab probe 实测拷贝 6184)
peak_tflops_fp16 = 1520      # klab probe 2026-09-20 实测 8192³ bf16 matmul 1520 TFLOPS(公开规格 2250 dense)
peak_tflops_fp32 = 80
