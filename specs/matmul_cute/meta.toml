name = "matmul_cute"
toolchain = "cute"
kernel_regex = "cutlass"   # CuTe DSL 生成的名字形如 kernel_cutlass_kernel_sm120_dense_gemm…(ncu 实测);宽了会把 torch 造输入的 kernel 也抓进来

# CuTe DSL(CUTLASS 4 Python 层)的 dense GEMM。_vendor/ 下是 NVIDIA 官方示例原文:
#   sm_120(5090):Sm120GemmKernel,mma.sync + cp.async 流水
#   sm_90(H100):HopperWgmmaGemmKernel,TMA + wgmma + warp specialization
# kernel.py 按当前卡的 cc 挑一个,B 以 (n, k) k-major 传入(TN GEMM),与另外两版 matmul 同一 case 尺寸。
[requires]
min_cc = 9.0
features = []

[tolerance]
atol = 1e-1
rtol = 1e-2

[[cases]]
name = "4096-f16"
m = 4096
n = 4096
k = 4096
dtype = "float16"

[[cases]]
name = "8192-f16"
m = 8192
n = 8192
k = 8192
dtype = "float16"
