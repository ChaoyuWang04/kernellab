name = "sgemm_cuda"
toolchain = "cuda"
kernel_regex = "sgemm_kernel"

# 裸 CUDA C++ 的经典分块 SGEMM(fp32、CUDA core,不用 tensor core):共享内存分块 + 每线程 4×4 寄存器块。
# 目的是验证 cuda 工具链(nvcc 现场编译成 torch 扩展),也是 CUDA core 侧的教学基线。
[requires]
min_cc = 7.0
features = []

[tolerance]
atol = 1e-2
rtol = 1e-3

[[cases]]
name = "2048-f32"
m = 2048
n = 2048
k = 2048
dtype = "float32"

[[cases]]
name = "4096-f32"
m = 4096
n = 4096
k = 4096
dtype = "float32"
