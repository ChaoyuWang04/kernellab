name = "matmul_tilelang"
problem = "matmul"          # 与 matmul_triton_ampere 同一道题,数字可以横着比
toolchain = "tilelang"
kernel_regex = "gemm_kernel"   # TileLang 0.1.14 生成的 kernel 名(ncu 实测)

# T.gemm 会按架构自己选 mma.sync / wgmma / tcgen05,所以不声明特性,两张卡都能跑。
[requires]
min_cc = 8.0
features = ["mma_sync", "async_copy"]

[tolerance]
atol = 1e-1
rtol = 1e-2

[[cases]]
name = "4096-bf16"
m = 4096
n = 4096
k = 4096
dtype = "bfloat16"

[[cases]]
name = "8192-bf16"
m = 8192
n = 8192
k = 8192
dtype = "bfloat16"

[[cases]]
name = "1000x999x777-bf16"
m = 1000
n = 999
k = 777
dtype = "bfloat16"

# 下面三档是为了暴露不同的瓶颈画像 —— 同尺寸方阵重复没有意义。
# 保留上面三档的名字不动,历史 bench 结果才能继续横着比。

# 小 K:算术强度只有 62 flop/B(4096³ 是 1365),K 方向只有 2 个分块步,
# 时间被 prologue/epilogue 主导。工作集 34.6 MB 整个住在 5090 的 96 MB L2 里,
# 所以 bench 报的 1689 GB/s 是 L2 供出来的「有效带宽」,NCU 看显存只有 3%。
# 这一档专门用来看「有效带宽」和「显存带宽」不是一回事。
[[cases]]
name = "smallK-4096x4096x64-bf16"
m = 4096
n = 4096
k = 64
dtype = "bfloat16"

# 瘦长:N 只有 512,列块数少(128 分块下只有 4 列)。
# 真实模型里 QKV 投影、lm_head 就是这个形状。考尾波与分块长宽比。
[[cases]]
name = "tall-16384x512x4096-bf16"
m = 16384
n = 512
k = 4096
dtype = "bfloat16"

# 大 K 小 MN:128 分块下只切出 4×4 = 16 个块,而卡有 108~170 个 SM。
# 基线只有 0.14× torch,是六档里最惨的。split-K 在这里实测快 5.6 倍(见参考答案 3)。
[[cases]]
name = "deepK-512x512x16384-bf16"
m = 512
n = 512
k = 16384
dtype = "bfloat16"
